name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install heatmap dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch public GitHub contribution data
        run: python scripts/fetch_contributions.py --username Aashu-Github

      - name: Render animated SVG heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed profile art
        shell: bash
        run: |
          if git diff --quiet -- data/contributions.json contrib-heatmap.svg; then
            echo "No profile-art changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          git commit -m "chore: refresh contribution graph [skip ci]"
          git push
